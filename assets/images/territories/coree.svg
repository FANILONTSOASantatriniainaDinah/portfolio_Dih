  <g clip-path="url(#territoryClip-kr)">
    <rect x="0" y="0" width="400" height="400" fill="#FFFFFF"/>

    <!-- Taegeuk : symbole officiel du drapeau sud-coréen.
         Géométrie exacte : chaque moitié (rouge/bleu) est composée
         d'un grand arc (rayon = R) et d'un petit arc (rayon = R/2)
         qui s'enroulent l'un dans l'autre pour former un "S" continu,
         sans étranglement au centre (forme fidèle au drapeau officiel,
         cf. image de référence fournie). -->
    <g transform="translate(195,200)">
      <circle r="38" fill="#FFFFFF" stroke="#222" stroke-width="0.6"/>
      <path d="M 0,-38 A 38,38 0 0,1 0,38 A 19,19 0 0,1 0,0 A 19,19 0 0,0 0,-38 Z" fill="#CD2E3A"/>
      <path d="M 0,-38 A 38,38 0 0,1 0,38 A 19,19 0 0,1 0,0 A 19,19 0 0,0 0,-38 Z" fill="#0047A0" transform="rotate(180)"/>
    </g>

    <!-- Les 4 trigrammes (Geon, Li, Gam, Gon), positionnés comme sur le vrai drapeau -->
    <g stroke="#222" stroke-width="3.6" stroke-linecap="square">
      <!-- Geon (haut-gauche) : 3 lignes pleines -->
      <g transform="translate(133,152)">
        <line x1="-14" y1="-9" x2="14" y2="-9"/>
        <line x1="-14" y1="0" x2="14" y2="0"/>
        <line x1="-14" y1="9" x2="14" y2="9"/>
      </g>
      <!-- Li (haut-droite) : pleine / coupée / pleine -->
      <g transform="translate(257,152)">
        <line x1="-14" y1="-9" x2="14" y2="-9"/>
        <line x1="-14" y1="0" x2="-3.5" y2="0"/>
        <line x1="3.5" y1="0" x2="14" y2="0"/>
        <line x1="-14" y1="9" x2="14" y2="9"/>
      </g>
      <!-- Gam (bas-gauche) : coupée / pleine / coupée -->
      <g transform="translate(133,248)">
        <line x1="-14" y1="-9" x2="-3.5" y2="-9"/>
        <line x1="3.5" y1="-9" x2="14" y2="-9"/>
        <line x1="-14" y1="0" x2="14" y2="0"/>
        <line x1="-14" y1="9" x2="-3.5" y2="9"/>
        <line x1="3.5" y1="9" x2="14" y2="9"/>
      </g>
      <!-- Gon (bas-droite) : 3 lignes coupées -->
      <g transform="translate(257,248)">
        <line x1="-14" y1="-9" x2="-3.5" y2="-9"/>
        <line x1="3.5" y1="-9" x2="14" y2="-9"/>
        <line x1="-14" y1="0" x2="-3.5" y2="0"/>
        <line x1="3.5" y1="0" x2="14" y2="0"/>
        <line x1="-14" y1="9" x2="-3.5" y2="9"/>
        <line x1="3.5" y1="9" x2="14" y2="9"/>
      </g>
    </g>

    <!-- Pas de voile vert ici : le drapeau coréen (blanc + Taegeuk) a besoin
         de rester net pour que le symbole reste lisible et reconnaissable. -->
  </g>
