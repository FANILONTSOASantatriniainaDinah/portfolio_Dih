<svg viewBox="0 0 800 533" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration : diagnostic territorial et identification des dents creuses">
  <rect width="800" height="533" fill="#f3e8c8"/>

  <!-- Plan cadastral stylisé -->
  <rect x="40" y="40" width="720" height="453" rx="22" fill="#e6d8ac"/>

  <!-- Trame parcellaire -->
  <g stroke="#cbbd8a" stroke-width="2" opacity="0.7">
    <path d="M40 145 H760 M40 250 H760 M40 355 H760 M40 460 H760"/>
    <path d="M165 40 V493 M290 40 V493 M415 40 V493 M540 40 V493 M665 40 V493"/>
  </g>

  <!-- Parcelles bâties (tissu urbain existant) -->
  <g fill="#5c6b52">
    <rect x="55" y="55" width="95" height="75" rx="4"/>
    <rect x="180" y="55" width="95" height="75" rx="4"/>
    <rect x="430" y="55" width="95" height="75" rx="4"/>
    <rect x="555" y="55" width="95" height="75" rx="4"/>
    <rect x="680" y="55" width="65" height="75" rx="4"/>
    <rect x="55" y="160" width="95" height="75" rx="4"/>
    <rect x="305" y="160" width="95" height="75" rx="4"/>
    <rect x="555" y="160" width="95" height="75" rx="4"/>
    <rect x="680" y="160" width="65" height="75" rx="4"/>
    <rect x="55" y="370" width="95" height="75" rx="4"/>
    <rect x="180" y="370" width="95" height="75" rx="4"/>
    <rect x="430" y="370" width="95" height="75" rx="4"/>
    <rect x="55" y="475" width="95" height="18" rx="4"/>
    <rect x="305" y="370" width="95" height="75" rx="4"/>
  </g>

  <!-- Dents creuses : parcelles mobilisables mises en évidence -->
  <g fill="#b86830" opacity="0.85">
    <rect x="305" y="55" width="95" height="75" rx="4"/>
    <rect x="180" y="160" width="95" height="75" rx="4"/>
    <rect x="430" y="160" width="95" height="75" rx="4"/>
    <rect x="180" y="475" width="95" height="18" rx="4"/>
    <rect x="555" y="370" width="95" height="75" rx="4"/>
  </g>
  <g fill="none" stroke="#fffaf0" stroke-width="2.5" stroke-dasharray="6 5">
    <rect x="305" y="55" width="95" height="75" rx="4"/>
    <rect x="180" y="160" width="95" height="75" rx="4"/>
    <rect x="430" y="160" width="95" height="75" rx="4"/>
    <rect x="555" y="370" width="95" height="75" rx="4"/>
  </g>

  <!-- Enveloppe urbaine -->
  <path d="M48 48 H752 V300 Q650 300 600 360 H300 Q260 300 200 300 H48 Z"
        fill="none" stroke="#284139" stroke-width="3" stroke-dasharray="2 6" opacity="0.55"/>

  <!-- Loupe d'analyse -->
  <g transform="translate(600,260)">
    <circle r="58" fill="rgba(255,250,240,.55)" stroke="#284139" stroke-width="3"/>
    <circle r="40" fill="none" stroke="#284139" stroke-width="3"/>
    <line x1="29" y1="29" x2="56" y2="56" stroke="#284139" stroke-width="10" stroke-linecap="round"/>
    <rect x="-20" y="-6" width="40" height="12" rx="3" fill="#b86830"/>
    <rect x="-6" y="-20" width="12" height="40" rx="3" fill="#b86830"/>
  </g>

  <!-- Carte flottante : indicateur de surface mobilisable -->
  <g transform="translate(80,330)">
    <rect width="190" height="92" rx="14" fill="#fffaf0" stroke="#fff" stroke-width="2"/>
    <rect x="18" y="18" width="14" height="14" rx="3" fill="#b86830"/>
    <rect x="40" y="20" width="120" height="10" rx="4" fill="#131c1a" opacity="0.7"/>
    <text x="18" y="60" font-family="Georgia, serif" font-size="26" font-weight="700" fill="#8f4f22">11,24</text>
    <rect x="100" y="48" width="72" height="9" rx="4" fill="#131c1a" opacity="0.35"/>
  </g>
</svg>
