  <ellipse cx="160" cy="120" rx="90" ry="55" fill="#809076" opacity="0.45"/>
  <ellipse cx="640" cy="400" rx="120" ry="70" fill="#809076" opacity="0.4"/>
  <ellipse cx="420" cy="430" rx="60" ry="36" fill="#809076" opacity="0.35"/>

